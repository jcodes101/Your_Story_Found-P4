name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import game resources
        run: godot --headless --path game --editor --import

      - name: Export game for the web
        run: |
          mkdir site
          godot --headless --path game --export-release Web ../site/index.html
          for file in site/Index.*; do
            [ -e "$file" ] || continue
            mv "$file" "${file/Index/index}"
          done

      - name: Validate Godot web export
        run: |
          test -s site/index.html
          test -s site/index.js
          test -s site/index.pck
          test -s site/index.wasm
          for asset in index.pck index.wasm; do
            expected_size=$(grep -o "\"${asset}\":[0-9]*" site/index.html | cut -d: -f2)
            actual_size=$(stat -c%s "site/$asset")
            if [ -z "$expected_size" ] || [ "$expected_size" != "$actual_size" ]; then
              echo "Invalid $asset: expected ${expected_size:-missing}, found $actual_size bytes"
              exit 1
            fi
          done

      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
